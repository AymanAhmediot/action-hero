name: Hello world workflows 

on: 
  push:
    branches:
      - main 
  pull_request:
    branches:
      - main
  workflow_dispatch:


jobs:
  hello:
    runs-on: ubuntu_latest 
    steps:
      - uses: actions/checkouts@v2 
      - name: hello world
        run: echo "Hello world"
        shell: bash 

  goodbye:
    runs-on: ubuntu_latest
    steps:
      - name: goodbye world
        run: echo "goodbye world
        shell: bash 

